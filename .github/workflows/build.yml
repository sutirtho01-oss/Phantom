name: Build Phantom

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Android NDK
        run: |
          mkdir -p $HOME/ndk && cd $HOME/ndk
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "ANDROID_NDK=$HOME/ndk/android-ndk-r25c" >> $GITHUB_ENV

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Compile native .so
        run: |
          cd native
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static
          make -j$(nproc)

      - name: Compile Java overlay to dex
        run: |
          mkdir -p java-out
          ANDROID_JAR=$ANDROID_HOME/platforms/android-34/android.jar
          javac --release 8 -cp "$ANDROID_JAR" -d java-out $(find java -name "*.java")
          $ANDROID_HOME/build-tools/34.0.0/d8 --output . --lib "$ANDROID_JAR" $(find java-out -name "*.class")

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp native/build/libphantom.so out/
          cp classes.dex out/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: phantom-build
          path: out/*
