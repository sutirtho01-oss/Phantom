name: Build Phantom

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Android NDK
        run: |
          mkdir -p $HOME/ndk && cd $HOME/ndk
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "ANDROID_NDK=$HOME/ndk/android-ndk-r25c" >> $GITHUB_ENV

      - name: Download Android SDK build-tools (for d8)
        run: |
          mkdir -p $HOME/sdk/cmdline-tools
          cd $HOME/sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/latest/ 2>/dev/null || true
          yes | cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/sdk "build-tools;34.0.0" >/dev/null
          echo "D8=$HOME/sdk/build-tools/34.0.0/d8" >> $GITHUB_ENV

      - name: Compile native .so
        run: |
          cd native
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared
          make -j$(nproc)

      - name: Compile Java overlay to dex
        run: |
          mkdir -p java-out
          javac -d java-out $(find java -name "*.java")
          chmod +x $D8
          $D8 --output . $(find java-out -name "*.class")

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp native/build/libphantom.so out/
          cp $ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so out/
          cp classes.dex out/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: phantom-build
          path: out/*